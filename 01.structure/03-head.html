<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>head 태그 연습</title>
    <link rel="stylesheet" href="style.css">
    <!-- 3. css 링크를 통한 방법
    -->

<!--
2. <style> 태그를 활용한 방법
<style>
    p { color: gray; } /* 이 문서에 있는 모든 p 태그에 적용 */
    h1 { color: darkred; }
</style>
-->

<body>
<!-- body : 화면에 보이는 내용을 적는 부모 태그 -->

<h1>이 제목은 style.com에서 토마토 색상으로 변경했음.</h1>
<p>이 문단은 style 태그로 회색으로 변경했음.</p>
<span style="color: blue;">이 문장은 style 속성으로 aqua 색으로 변경했음.</span>

<!-- 1. 태그에 직접 style 속성으로 부여하는 방법 -->

</body>
</html>
