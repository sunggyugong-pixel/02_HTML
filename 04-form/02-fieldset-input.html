<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Fieldset</title>
</head>
<body>
<form action="" method="get">
    <!-- fieldset : 폼 요소를 시각적으로 묶음 -->
    <fieldset>
        <!-- legend : 이 fieldset 묶음의 이름표 -->
        <legend>기본 정보</legend>
        <label>
            이메일 <input type="text" name="email" placeholder="이메일을 입력해주세요" autofocus />
            <!-- placeholder : 안내문 / autofocus : 포커싱 -->
        </label>
        <label>
            아이디 <input type="text" name="id" required minlength="4" maxlength="12" />
        </label>
        <label>
            가입 코드 <input type="text" name="code" value="반갑습니다" readonly />
            <!-- readonly : 읽기전용 -->
        </label>
    </fieldset>

    <fieldset>
        <legend>추가 정보</legend>
        <label for="people">인원</label>
        <input id="people" type="number" name="people" min="1" max="10" step="4" value="2" />

    </fieldset>

    <button type="submit">전송</button>

</form>
</body>
</html>
