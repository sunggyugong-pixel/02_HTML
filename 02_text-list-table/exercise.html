<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <style>
        table {
            border-collapse: collapse;
            margin-bottom: 24px;
            padding:6px 16px;
            text-align: center;
        }

        th,
        td {
            border: 1px solid #94a3b8;
            padding: 12px 24px;
        }
    </style>
</head>
<body>
<table>
    <tbody>
    <tr>
        <td>셀1</td>
        <td>셀2</td>
        <td>셀3</td>
        <td>셀4</td>
    </tr>
    <tr>
        <td>셀5</td>
        <td colspan="2">colspan="2"</td>
        <td>셀8</td>
    </tr>
    <tr>
        <td>셀9</td>
        <td rowspan="2">rowspan="2"</td>
        <td>셀11</td>
        <td>셀12</td>
    </tr>
    <tr>
        <td>셀13</td>
        <td>셀15</td>
        <td>셀16</td>
    </tr>
    </tbody>
</table>
</body>
</html>
